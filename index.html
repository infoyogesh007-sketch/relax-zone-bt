<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relax Zone Command Finder</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    h2 { margin: 0 0 8px 0; font-size: 17px; }
    .sub { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { border: none; border-radius: 10px; padding: 11px 13px; font-size: 14px; font-weight: 600; color: #fff; background: #2563eb; cursor: pointer; }
    button:active { opacity: 0.85; }
    .btn-add { background: #16a34a; flex: 1; }
    .btn-stop { background: #b91c1c; }
    .btn-probe { background: #d97706; flex: 1; }
    .btn-sec { background: #334155; font-size: 12px; padding: 8px 10px; }
    .btn-active { background: #0284c7; outline: 2px solid #38bdf8; }
    .chair-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-top: 8px; }
    .chair-item.selected { border-color: #38bdf8; background: #0c4a6e; }
    input { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-family: monospace; font-size: 15px; }
    #log { background: #020617; border: 1px solid #334155; border-radius: 10px; height: 270px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-all; margin-top: 8px; }
    .tx { color: #38bdf8; } .rx { color: #4ade80; font-weight: 600; } .info { color: #cbd5e1; } .warn { color: #fbbf24; font-weight: 700; } .err { color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <h2>Relax Zone Command Finder</h2>
      <span id="statusBadge" class="sub" style="margin:0;color:#fbbf24;">0 Connected</span>
    </div>
    <div id="targetLabel" class="sub">प्रथम १ बंद (Standby) खुर्ची कनेक्ट करा</div>
    <div class="row">
      <button class="btn-add" onclick="addChair()">+ Add Chair</button>
      <button class="btn-stop" onclick="disconnectAll()">Disconnect</button>
    </div>
    <div id="chairList"></div>
  </div>

  <div class="card">
    <h2>Write Channel निवडा</h2>
    <div id="writeChars" class="row"><span class="sub">कनेक्ट केल्यावर येथे चॅनेल्स दिसतील</span></div>
  </div>

  <div class="card">
    <h2>Auto Command Finder</h2>
    <div id="probeStatus" class="sub">खुर्ची बंद असताना हे बटण दाबा — खुर्ची हलली किंवा बीप झाली तर लगेच Stop दाबा.</div>
    <div class="row">
      <button class="btn-probe" onclick="startProbe()">Auto Find Command</button>
      <button class="btn-stop" onclick="stopProbe()">Stop Probe</button>
    </div>
    <div class="row" style="margin-top: 10px; flex-wrap: nowrap;">
      <input id="hexInput" value="82 01" placeholder="फक्त मधले bytes उदा. 82 01" />
      <button onclick="sendAutoChk()">Send F0..F1</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <h2 style="margin:0;">Changed TX / RX Log</h2>
      <div class="row">
        <button class="btn-sec" onclick="copyLogs()">Copy Log</button>
        <button class="btn-sec" onclick="clearLogs()">Clear</button>
      </div>
    </div>
    <div id="log"></div>
  </div>

<script>
const OPTIONAL_SERVICES = [
  '0000fff0-0000-1000-8000-00805f9b34fb',
  '0000ffe0-0000-1000-8000-00805f9b34fb',
  '00001800-0000-1000-8000-00805f9b34fb',
  '0000180a-0000-1000-8000-00805f9b34fb'
];

const chairs = new Map();
const lastRxMap = new Map();
let selectedId = null;
let probeRunning = false;
let lastProbeTx = '';

function shortUuid(u) {
  return u.endsWith('-0000-1000-8000-00805f9b34fb') ? '0x' + u.slice(4, 8).toUpperCase() : u.slice(0, 8);
}

function toHex(buf) {
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

function buildF0Frame(inner) {
  let sum = 0;
  for (const b of inner) sum = (sum + b) & 0xFF;
  const chk = (~sum) & 0x7F;
  return new Uint8Array([0xF0, ...inner, chk, 0xF1]);
}

function addLog(cls, msg) {
  const box = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls;
  const t = new Date().toLocaleTimeString('en-GB', { hour12: false });
  line.textContent = `[${t}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function clearLogs() {
  document.getElementById('log').innerHTML = '';
  lastRxMap.clear();
}

async function copyLogs() {
  const txt = document.getElementById('log').innerText;
  if (!txt) return addLog('warn', 'लॉग रिकामा आहे.');
  await navigator.clipboard.writeText(txt);
  addLog('info', 'लॉग कॉपी झाला! आता चॅटमध्ये Paste करा.');
}

async function addChair() {
  if (!navigator.bluetooth) return addLog('err', 'Android Chrome वापरा.');
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: OPTIONAL_SERVICES
    });
    const name = device.name || 'Unnamed';
    const server = await device.gatt.connect();
    addLog('rx', `Connected: ${name}`);

    const services = await server.getPrimaryServices();
    const writeList = [];

    for (const svc of services) {
      const sName = shortUuid(svc.uuid);
      if (sName === '0x1800' || sName === '0x1801') continue;
      const chars = await svc.getCharacteristics();
      for (const ch of chars) {
        const p = ch.properties;
        const cName = shortUuid(ch.uuid);
        if (p.write || p.writeWithoutResponse) {
          writeList.push({ uuid: ch.uuid, label: `${sName}:${cName}`, char: ch });
        }
        if (p.notify || p.indicate) {
          ch.addEventListener('characteristicvaluechanged', e => {
            const hex = toHex(e.target.value.buffer);
            const key = `${device.id}:${ch.uuid}`;
            if (lastRxMap.get(key) === hex) return;
            lastRxMap.set(key, hex);
            addLog('rx', `RX [${cName}] <- ${hex}`);
            if (probeRunning && cName === '0734594a' && lastProbeTx) {
              addLog('warn', `MATCH! या कमांडने खुर्चीचा डेटा बदलला: ${lastProbeTx}`);
              probeRunning = false;
              document.getElementById('probeStatus').textContent = `सापडले! Command: ${lastProbeTx}`;
            }
          });
          await ch.startNotifications();
          addLog('info', `Notify ON: ${cName}`);
        }
      }
    }

    writeList.sort((a, b) => (b.label.includes('8b00ace7') ? 1 : 0) - (a.label.includes('8b00ace7') ? 1 : 0));

    chairs.set(device.id, { id: device.id, name, device, writeList, activeWriteIdx: 0 });
    selectedId = device.id;

    device.addEventListener('gattserverdisconnected', () => {
      probeRunning = false;
      chairs.delete(device.id);
      if (selectedId === device.id) selectedId = chairs.keys().next().value || null;
      addLog('warn', `Disconnected: ${name}`);
      render();
    });

    render();
  } catch (e) {
    addLog('err', `Error: ${e.message}`);
  }
}

function disconnectAll() {
  stopProbe();
  for (const s of chairs.values()) { try { s.device.gatt.disconnect(); } catch (_) {} }
  chairs.clear();
  selectedId = null;
  render();
}

function render() {
  document.getElementById('statusBadge').textContent = `${chairs.size} Connected`;
  const list = document.getElementById('chairList');
  list.innerHTML = '';
  const wc = document.getElementById('writeChars');
  wc.innerHTML = '';

  const sel = chairs.get(selectedId);
  document.getElementById('targetLabel').textContent = sel ? `निवडलेली खुर्ची: ${sel.name}` : 'प्रथम १ बंद (Standby) खुर्ची कनेक्ट करा';

  for (const s of chairs.values()) {
    const div = document.createElement('div');
    div.className = 'chair-item' + (s.id === selectedId ? ' selected' : '');
    div.onclick = () => { selectedId = s.id; render(); };
    const span = document.createElement('span');
    span.textContent = s.name;
    const btn = document.createElement('button');
    btn.className = 'btn-sec';
    btn.textContent = 'Disconnect';
    btn.onclick = ev => { ev.stopPropagation(); try { s.device.gatt.disconnect(); } catch (_) {} };
    div.appendChild(span);
    div.appendChild(btn);
    list.appendChild(div);
  }

  if (sel && sel.writeList.length > 0) {
    sel.writeList.forEach((w, idx) => {
      const b = document.createElement('button');
      b.className = 'btn-sec' + (idx === sel.activeWriteIdx ? ' btn-active' : '');
      b.textContent = w.label;
      b.onclick = () => { sel.activeWriteIdx = idx; render(); };
      wc.appendChild(b);
    });
  } else {
    wc.innerHTML = '<span class="sub">Write channel नाही</span>';
  }
}

async function writeBytes(bytes, logTx = true) {
  const s = chairs.get(selectedId);
  if (!s) throw new Error('खुर्ची कनेक्ट नाही');
  const w = s.writeList[s.activeWriteIdx];
  if (!w) throw new Error('Write channel नाही');
  if (logTx) addLog('tx', `TX [${w.label}] -> ${toHex(bytes.buffer)}`);
  const ch = w.char;
  if (ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse) {
    await ch.writeValueWithoutResponse(bytes);
  } else if (ch.writeValueWithResponse) {
    await ch.writeValueWithResponse(bytes);
  } else {
    await ch.writeValue(bytes);
  }
}

async function sendAutoChk() {
  const raw = document.getElementById('hexInput').value.replace(/[^0-9a-fA-F]/g, '');
  if (!raw || raw.length % 2 !== 0) return addLog('err', 'चुकीचा Hex!');
  const inner = raw.match(/.{2}/g).map(h => parseInt(h, 16));
  const frame = buildF0Frame(inner);
  try { await writeBytes(frame, true); } catch (e) { addLog('err', e.message); }
}

function stopProbe() {
  probeRunning = false;
  document.getElementById('probeStatus').textContent = 'Probe थांबवले.';
}

async function startProbe() {
  const s = chairs.get(selectedId);
  if (!s) return addLog('err', 'प्रथम १ खुर्ची कनेक्ट करा.');
  if (probeRunning) return;

  const frames = [];
  for (const k of [0x01, 0x00, 0x02, 0x10, 0x20, 0x40, 0x81, 0x82]) {
    frames.push(buildF0Frame([k]));
  }
  const types = [0x81, 0x82, 0x83, 0x84, 0x85, 0x86, 0x88, 0x8A, 0x8C, 0x01, 0x02, 0x00, 0x40, 0x55];
  const keys = [0x01, 0x00, 0x02, 0x10, 0x20, 0x40, 0x08];
  for (const t of types) {
    for (const k of keys) frames.push(buildF0Frame([t, k]));
  }
  for (const t of [0x81, 0x82, 0x83, 0x84, 0x85, 0x8A, 0x01, 0x02]) {
    for (const k of [0x01, 0x02, 0x10, 0x40]) {
      frames.push(buildF0Frame([t, 0x00, k]));
      frames.push(buildF0Frame([t, k, 0x00]));
    }
  }
  frames.push(buildF0Frame([0x40, 0x03, 0x00, 0x00, 0x00, 0x00, 0x02, 0x0D, 0x00, 0x00, 0x10, 0x02, 0x00]));

  probeRunning = true;
  addLog('info', `Probe सुरू (${frames.length} commands) on ${s.writeList[s.activeWriteIdx].label}...`);

  for (let i = 0; i < frames.length; i++) {
    if (!probeRunning) break;
    const f = frames[i];
    lastProbeTx = toHex(f.buffer);
    document.getElementById('probeStatus').textContent = `Testing ${i + 1}/${frames.length}: ${lastProbeTx}`;
    try {
      await writeBytes(f, false);
    } catch (e) {
      addLog('err', `Probe Error: ${e.message}`);
      probeRunning = false;
      break;
    }
    await new Promise(r => setTimeout(r, 250));
  }

  if (probeRunning) {
    probeRunning = false;
    addLog('warn', 'सर्व टेस्ट पूर्ण झाले. वर दुसरा Write Channel निवडून पुन्हा प्रयत्न करा.');
    document.getElementById('probeStatus').textContent = 'पूर्ण झाले — दुसरा चॅनेल निवडून पुन्हा तपासा.';
  }
}

addLog('info', 'रेडी. १ खुर्ची कनेक्ट करून "Auto Find Command" दाबा.');
</script>
</body>
</html>
