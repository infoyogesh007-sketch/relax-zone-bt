<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lixo-LI6001 Key Mapper</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    h2 { margin: 0 0 8px 0; font-size: 16px; }
    .sub { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { border: none; border-radius: 10px; padding: 11px 10px; font-size: 14px; font-weight: 700; color: #fff; background: #2563eb; cursor: pointer; }
    button:active { opacity: 0.8; transform: scale(0.97); }
    .btn-add { background: #16a34a; flex: 1; }
    .btn-stop { background: #b91c1c; }
    .btn-pwr { background: #dc2626; width: 100%; padding: 14px; font-size: 16px; margin-bottom: 10px; }
    .btn-sec { background: #334155; font-size: 12px; padding: 8px 10px; }
    .btn-active { background: #0284c7; outline: 2px solid #38bdf8; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .key-btn { background: #1d4ed8; font-family: monospace; font-size: 14px; padding: 12px 4px; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #334155; }
    .badge.on { background: #15803d; color: #fff; }
    input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-family: monospace; font-size: 14px; }
    #log { background: #020617; border: 1px solid #334155; border-radius: 10px; height: 210px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-all; margin-top: 8px; }
    .tx { color: #38bdf8; } .rx { color: #4ade80; font-weight: 600; } .info { color: #cbd5e1; } .err { color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <h2 style="margin:0;">Lixo-LI6001 Key Mapper</h2>
      <span id="chairState" class="badge">Disconnected</span>
    </div>
    <div class="row">
      <button class="btn-add" onclick="connectChair()">+ Connect Chair</button>
      <button class="btn-stop" onclick="disconnectChair()">Disconnect</button>
    </div>
    <div id="writeChars" class="row" style="margin-top:8px;"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <h2 style="margin:0;">Key Buttons (F0 81 XX)</h2>
      <button id="rangeBtn" class="btn-sec" onclick="toggleRange()">Show 40..7F</button>
    </div>
    <button class="btn-pwr" onclick="sendKey(0x01)">81 01 — POWER (ON / OFF)</button>
    <div class="sub">प्रथम Power दाबून खुर्ची ON करा, नंतर खालील बटणे एकेक दाबून कोणते बटण काय काम करते ते पहा:</div>
    <div id="keyGrid" class="grid4"></div>
    <div class="row" style="margin-top: 10px;">
      <input id="hexInput" value="81 01" placeholder="उदा. 81 02 किंवा 82 01" />
      <button onclick="sendManual()">Send</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <h2 style="margin:0;">TX / Changed RX Log</h2>
      <div class="row">
        <button class="btn-sec" onclick="copyLogs()">Copy Log</button>
        <button class="btn-sec" onclick="clearLogs()">Clear</button>
      </div>
    </div>
    <div id="log"></div>
  </div>

<script>
const OPTIONAL_SERVICES = ['0000fff0-0000-1000-8000-00805f9b34fb'];
let session = null;
let lastRx = '';
let highRange = false;

function shortUuid(u) {
  return u.endsWith('-0000-1000-8000-00805f9b34fb') ? '0x' + u.slice(4, 8).toUpperCase() : u.slice(0, 8);
}

function toHex(buf) {
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

function buildF0Frame(inner) {
  let sum = 0;
  for (const b of inner) sum = (sum + b) & 0xFF;
  return new Uint8Array([0xF0, ...inner, (~sum) & 0x7F, 0xF1]);
}

function addLog(cls, msg) {
  const box = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls;
  const t = new Date().toLocaleTimeString('en-GB', { hour12: false });
  line.textContent = `[${t}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function clearLogs() { document.getElementById('log').innerHTML = ''; lastRx = ''; }

async function copyLogs() {
  const txt = document.getElementById('log').innerText;
  if (!txt) return;
  await navigator.clipboard.writeText(txt);
  addLog('info', 'कॉपी झाले! चॅटमध्ये Paste करा.');
}

function renderKeys() {
  const grid = document.getElementById('keyGrid');
  grid.innerHTML = '';
  const start = highRange ? 0x40 : 0x00;
  const end = highRange ? 0x7F : 0x3F;
  for (let k = start; k <= end; k++) {
    if (k === 0x01) continue;
    const hex = k.toString(16).padStart(2, '0').toUpperCase();
    const b = document.createElement('button');
    b.className = 'key-btn';
    b.textContent = hex;
    b.onclick = () => sendKey(k);
    grid.appendChild(b);
  }
  document.getElementById('rangeBtn').textContent = highRange ? 'Show 00..3F' : 'Show 40..7F';
}

function toggleRange() { highRange = !highRange; renderKeys(); }

async function connectChair() {
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: OPTIONAL_SERVICES
    });
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
    const chars = await svc.getCharacteristics();
    const writeList = [];

    for (const ch of chars) {
      const p = ch.properties;
      const cName = shortUuid(ch.uuid);
      if (p.write || p.writeWithoutResponse) writeList.push({ label: cName, char: ch });
      if (p.notify || p.indicate) {
        ch.addEventListener('characteristicvaluechanged', e => {
          const d = new Uint8Array(e.target.value.buffer);
          const hex = toHex(d.buffer);
          if (cName === '0734594a') {
            if (d.length >= 16 && d[0] === 0xF0 && d[15] === 0xF1) {
              const isOn = (d[1] & 0x40) !== 0;
              const badge = document.getElementById('chairState');
              badge.textContent = isOn ? `ON (Mode:${d[7]} Pos:${d[8]})` : 'Standby OFF';
              badge.className = 'badge' + (isOn ? ' on' : '');
            }
            if (hex === lastRx) return;
            lastRx = hex;
          }
          addLog('rx', `RX [${cName}] <- ${hex}`);
        });
        await ch.startNotifications();
      }
    }

    writeList.sort((a, b) => (b.label === '0xFFF1' ? 1 : 0) - (a.label === '0xFFF1' ? 1 : 0));
    session = { device, writeList, idx: 0 };

    device.addEventListener('gattserverdisconnected', () => {
      session = null;
      const badge = document.getElementById('chairState');
      badge.textContent = 'Disconnected';
      badge.className = 'badge';
      addLog('err', 'Disconnected');
    });

    renderWriteChannels();
    addLog('info', `Connected: ${device.name || 'Chair'} (0xFFF1 Selected)`);
  } catch (e) {
    addLog('err', e.message);
  }
}

function renderWriteChannels() {
  const wc = document.getElementById('writeChars');
  wc.innerHTML = '';
  if (!session) return;
  session.writeList.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'btn-sec' + (i === session.idx ? ' btn-active' : '');
    b.textContent = w.label;
    b.onclick = () => { session.idx = i; renderWriteChannels(); };
    wc.appendChild(b);
  });
}

function disconnectChair() {
  if (session) { try { session.device.gatt.disconnect(); } catch (_) {} }
}

async function sendFrame(inner) {
  if (!session) return addLog('err', 'प्रथम "+ Connect Chair" दाबा.');
  const ch = session.writeList[session.idx].char;
  const frame = buildF0Frame(inner);
  addLog('tx', `TX -> ${toHex(frame.buffer)}`);
  if (ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse) {
    await ch.writeValueWithoutResponse(frame);
  } else if (ch.writeValueWithResponse) {
    await ch.writeValueWithResponse(frame);
  } else {
    await ch.writeValue(frame);
  }
}

function sendKey(k) { sendFrame([0x81, k]); }

function sendManual() {
  const raw = document.getElementById('hexInput').value.replace(/[^0-9a-fA-F]/g, '');
  if (!raw || raw.length % 2 !== 0) return addLog('err', 'चुकीचा Hex!');
  sendFrame(raw.match(/.{2}/g).map(h => parseInt(h, 16)));
}

renderKeys();
addLog('info', 'रेडी. खुर्ची कनेक्ट करून "81 01 — POWER" आणि इतर बटणे तपासा.');
</script>
</body>
</html>
