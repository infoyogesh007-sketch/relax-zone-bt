<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relax Zone BLE Diagnostic</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    h2 { margin: 0 0 8px 0; font-size: 17px; }
    .sub { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { border: none; border-radius: 10px; padding: 11px 13px; font-size: 14px; font-weight: 600; color: #fff; background: #2563eb; cursor: pointer; }
    button:active { opacity: 0.85; }
    .btn-add { background: #16a34a; flex: 1; }
    .btn-stop { background: #b91c1c; }
    .btn-sec { background: #334155; font-size: 12px; padding: 8px 10px; }
    .btn-active { background: #0284c7; outline: 2px solid #38bdf8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chair-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-top: 8px; }
    .chair-item.selected { border-color: #38bdf8; background: #0c4a6e; }
    input { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-family: monospace; font-size: 15px; }
    #log { background: #020617; border: 1px solid #334155; border-radius: 10px; height: 260px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-all; margin-top: 8px; }
    .tx { color: #38bdf8; } .rx { color: #4ade80; font-weight: 600; } .info { color: #cbd5e1; } .warn { color: #fbbf24; } .err { color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <h2>Relax Zone BLE Scan</h2>
      <span id="statusBadge" class="sub" style="margin:0;color:#fbbf24;">0 Connected</span>
    </div>
    <div id="targetLabel" class="sub">प्रथम १ खुर्ची कनेक्ट करा</div>
    <div class="row">
      <button class="btn-add" onclick="addChair()">+ Add Chair</button>
      <button class="btn-stop" onclick="disconnectAll()">Disconnect All</button>
    </div>
    <div id="chairList"></div>
  </div>

  <div class="card">
    <h2>Write Channel निवडा (आपणहून निवडला जाईल)</h2>
    <div id="writeChars" class="row"><span class="sub">कनेक्ट केल्यावर येथे चॅनेल्स दिसतील</span></div>
  </div>

  <div class="card">
    <h2>Quick Test Commands</h2>
    <div class="grid">
      <button onclick="sendHex('01')">Test: 01</button>
      <button class="btn-stop" onclick="sendHex('00')">Test: 00</button>
      <button onclick="sendHex('AA 55 01')">Test: AA 55 01</button>
      <button onclick="sendHex('55 AA 01')">Test: 55 AA 01</button>
      <button onclick="sendHex('F0 01')">Test: F0 01</button>
      <button onclick="sendHex('FE 01')">Test: FE 01</button>
    </div>
    <div class="row" style="margin-top: 10px; flex-wrap: nowrap;">
      <input id="hexInput" value="01" placeholder="उदा. AA 55 01" />
      <button onclick="sendManual()">Send</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <h2 style="margin:0;">Live Log</h2>
      <div class="row">
        <button class="btn-sec" onclick="copyLogs()">Copy Log</button>
        <button class="btn-sec" onclick="clearLogs()">Clear</button>
      </div>
    </div>
    <div id="log"></div>
  </div>

<script>
const OPTIONAL_SERVICES = [
  '0000fff0-0000-1000-8000-00805f9b34fb',
  '0000ffe0-0000-1000-8000-00805f9b34fb',
  '0000ffe5-0000-1000-8000-00805f9b34fb',
  '0000ffb0-0000-1000-8000-00805f9b34fb',
  '0000ffa0-0000-1000-8000-00805f9b34fb',
  '0000fee0-0000-1000-8000-00805f9b34fb',
  '0000ae00-0000-1000-8000-00805f9b34fb',
  '0000ae30-0000-1000-8000-00805f9b34fb',
  '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  '00001800-0000-1000-8000-00805f9b34fb',
  '00001801-0000-1000-8000-00805f9b34fb',
  '0000180a-0000-1000-8000-00805f9b34fb',
  '0000180f-0000-1000-8000-00805f9b34fb'
];

const chairs = new Map();
let selectedId = null;

function shortUuid(u) {
  return u.endsWith('-0000-1000-8000-00805f9b34fb') ? '0x' + u.slice(4, 8).toUpperCase() : u.slice(0, 8);
}

function toHex(buf) {
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

function addLog(cls, msg) {
  const box = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls;
  const t = new Date().toLocaleTimeString('en-GB', { hour12: false });
  line.textContent = `[${t}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function clearLogs() { document.getElementById('log').innerHTML = ''; }

async function copyLogs() {
  const txt = document.getElementById('log').innerText;
  if (!txt) return addLog('warn', 'लॉग रिकामा आहे.');
  await navigator.clipboard.writeText(txt);
  addLog('info', 'लॉग कॉपी झाला! आता चॅटमध्ये पेस्ट करा.');
}

async function addChair() {
  if (!navigator.bluetooth) return addLog('err', 'हा ब्राउझर Web Bluetooth सपोर्ट करत नाही. Android Chrome वापरा.');
  try {
    addLog('info', 'Bluetooth डिव्हाइस शोधत आहे...');
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: OPTIONAL_SERVICES
    });
    const name = device.name || 'Unnamed';
    addLog('info', `निवडले: ${name} (${device.id})`);

    const server = await device.gatt.connect();
    addLog('rx', `GATT Connected: ${name}`);

    const services = await server.getPrimaryServices();
    addLog('info', `${services.length} Services सापडल्या:`);

    const writeList = [];
    let notifyCount = 0;

    for (const svc of services) {
      const sName = shortUuid(svc.uuid);
      addLog('info', `SVC ${sName}`);
      try {
        const chars = await svc.getCharacteristics();
        for (const ch of chars) {
          const p = ch.properties;
          const flags = [
            p.read ? 'R' : '',
            p.write ? 'W' : '',
            p.writeWithoutResponse ? 'WNR' : '',
            p.notify ? 'N' : '',
            p.indicate ? 'I' : ''
          ].filter(Boolean).join('/');
          const cName = shortUuid(ch.uuid);
          addLog('info', `  CHR ${cName} [${flags}]`);

          if ((p.write || p.writeWithoutResponse) && sName !== '0x1800' && sName !== '0x1801') {
            writeList.push({ uuid: ch.uuid, label: `${sName}:${cName}`, char: ch });
          }

          if (p.notify || p.indicate) {
            try {
              ch.addEventListener('characteristicvaluechanged', e => {
                addLog('rx', `RX [${name} ${cName}] <- ${toHex(e.target.value.buffer)}`);
              });
              await ch.startNotifications();
              notifyCount++;
              addLog('rx', `  Notify ON -> ${cName}`);
            } catch (ne) {
              addLog('warn', `  Notify FAIL ${cName}: ${ne.message}`);
            }
          }

          if (p.read && sName !== '0x1800' && sName !== '0x1801') {
            try {
              const val = await ch.readValue();
              if (val.byteLength > 0) addLog('rx', `  READ [${cName}]: ${toHex(val.buffer)}`);
            } catch (_) {}
          }
        }
      } catch (ce) {
        addLog('warn', `  Chars err (${sName}): ${ce.message}`);
      }
    }

    const session = {
      id: device.id,
      name,
      device,
      writeList,
      activeWriteIdx: 0
    };
    chairs.set(device.id, session);
    selectedId = device.id;

    device.addEventListener('gattserverdisconnected', () => {
      chairs.delete(device.id);
      if (selectedId === device.id) selectedId = chairs.keys().next().value || null;
      addLog('warn', `Disconnected: ${name}`);
      render();
    });

    addLog('info', `तयार! Write channels: ${writeList.length}, Notify ON: ${notifyCount}`);
    render();
  } catch (e) {
    addLog('err', `Error: ${e.message}`);
  }
}

function disconnectAll() {
  for (const s of chairs.values()) {
    try { s.device.gatt.disconnect(); } catch (_) {}
  }
  chairs.clear();
  selectedId = null;
  render();
}

function render() {
  document.getElementById('statusBadge').textContent = `${chairs.size} Connected`;
  const list = document.getElementById('chairList');
  list.innerHTML = '';
  const wc = document.getElementById('writeChars');
  wc.innerHTML = '';

  const sel = chairs.get(selectedId);
  document.getElementById('targetLabel').textContent = sel ? `निवडलेली खुर्ची: ${sel.name}` : 'प्रथम १ खुर्ची कनेक्ट करा';

  for (const s of chairs.values()) {
    const div = document.createElement('div');
    div.className = 'chair-item' + (s.id === selectedId ? ' selected' : '');
    div.onclick = () => { selectedId = s.id; render(); };
    div.innerHTML = `<span>${s.name}</span><button class="btn-sec" onclick="event.stopPropagation(); disconnectOne('${s.id}')">Disconnect</button>`;
    list.appendChild(div);
  }

  if (sel && sel.writeList.length > 0) {
    sel.writeList.forEach((w, idx) => {
      const b = document.createElement('button');
      b.className = 'btn-sec' + (idx === sel.activeWriteIdx ? ' btn-active' : '');
      b.textContent = w.label;
      b.onclick = () => { sel.activeWriteIdx = idx; render(); };
      wc.appendChild(b);
    });
  } else {
    wc.innerHTML = '<span class="sub">Write channel सापडला नाही</span>';
  }
}

function disconnectOne(id) {
  const s = chairs.get(id);
  if (s) { try { s.device.gatt.disconnect(); } catch (_) {} }
}

async function sendHex(hexStr) {
  const s = chairs.get(selectedId);
  if (!s) return addLog('err', 'प्रथम "+ Add Chair" ने खुर्ची कनेक्ट करा.');
  const w = s.writeList[s.activeWriteIdx];
  if (!w) return addLog('err', `${s.name} मध्ये कोणताही Write channel सापडला नाही.`);

  const clean = hexStr.replace(/[^0-9a-fA-F]/g, '');
  if (!clean || clean.length % 2 !== 0) return addLog('err', 'चुकीचा Hex कोड!');
  const bytes = new Uint8Array(clean.match(/.{2}/g).map(h => parseInt(h, 16)));

  try {
    addLog('tx', `TX [${s.name} ${w.label}] -> ${toHex(bytes.buffer)}`);
    const ch = w.char;
    if (ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse) {
      await ch.writeValueWithoutResponse(bytes);
    } else if (ch.writeValueWithResponse) {
      await ch.writeValueWithResponse(bytes);
    } else {
      await ch.writeValue(bytes);
    }
  } catch (e) {
    addLog('err', `Send Error: ${e.message}`);
  }
}

function sendManual() {
  sendHex(document.getElementById('hexInput').value);
}

addLog('info', 'रेडी. "+ Add Chair" दाबून १ खुर्ची कनेक्ट करा.');
</script>
</body>
</html>
